name: Build mobile apps

on:
  push:
    branches: [feature/flutter-crm-app, feature/full-premium-app]
  pull_request:
  workflow_dispatch:

# Meta App ID is a public client identifier (safe to keep here). It enables
# the in-app "Connect Facebook Page" flow for Meta Lead Ads.
env:
  META_APP_ID: "1581914519978056"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release --dart-define=META_APP_ID=${{ env.META_APP_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: codeskate-crm-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cd ios && pod install --repo-update
      # Unsigned build proves the iOS project compiles. For TestFlight, add
      # your Apple certificates/provisioning profile and use `flutter build ipa`.
      - run: flutter build ios --release --no-codesign --dart-define=META_APP_ID=${{ env.META_APP_ID }}
      - run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr codeskate-crm-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: codeskate-crm-ios-unsigned
          path: codeskate-crm-unsigned.ipa
