name: codeskate_crm
description: Codeskate CRM - Lead Management & WhatsApp Business App
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.0
  
  # State Management
  provider: ^6.1.1
  
  # UI & Animations
  cupertino_icons: ^2.0.0
  google_fonts: ^6.3.3
  flutter_animate: ^4.3.0
  shimmer: ^4.0.0
  cached_network_image: ^4.0.4
  fl_chart: ^1.2.0
  
  # Navigation
  go_router: ^18.1.0
  
  # Payments
  razorpay_flutter: ^1.3.5

  # Utils
  intl: ^0.20.3
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  pinput: ^7.0.0
  timeago: ^3.6.1
  http: ^1.2.0
  uuid: ^4.3.3
  flutter_local_notifications: ^22.3.2
  package_info_plus: ^10.2.2
  flutter_facebook_auth: ^7.1.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  # Space Grotesk / Inter / JetBrains Mono are loaded at runtime via the
  # google_fonts package (same brand type system as the web CRM).

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F04E00"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_mono.png
  min_sdk_android: 23
