name: codeskate_crm
description: Codeskate CRM - Lead Management & WhatsApp Business App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.0
  
  # State Management
  provider: ^6.1.1
  
  # UI & Animations
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  fl_chart: ^0.65.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Payments
  razorpay_flutter: ^1.3.5

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  pinput: ^3.0.1
  timeago: ^3.6.1
  http: ^1.2.0
  uuid: ^4.3.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  # Note: Poppins font is loaded at runtime via the google_fonts package,
  # so no local font files need to be bundled here.
